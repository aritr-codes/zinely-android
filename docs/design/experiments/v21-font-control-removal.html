<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zinely selected-text toolbar experiment</title>

<!--
  HISTORICAL COMPARISON ONLY. The implementation specification is canonical Bench A24 / ADR-115.

  v=0 reconstructs the pre-A24 selected-text toolbar with its disabled Font action.
  v=1 shows the accepted five-action toolbar without Font.
  scale=1.8 applies a web text-size stress approximation; Android font-scale acceptance remains separate.

  Both conditions load the same canonical v21 Bench. Owner approval replaced the cohort study;
  no measured usability benefit is claimed. The old alternative remains available for comparison.
-->
<style>
  html, body, iframe { width: 100%; height: 100%; margin: 0; border: 0; }
  body { overflow: hidden; background: #27270f; }
</style>

<iframe
  id="prototype"
  title="Zinely Bench prototype"
  src="../mockups/v21-bench.html"
></iframe>

<script>
const params = new URLSearchParams(location.search);
const variant = params.get('v') === '1' ? 'no-font' : 'current';
const requestedScale = Number(params.get('scale') || '1');
const textScale = Number.isFinite(requestedScale) && requestedScale >= 1 && requestedScale <= 2
  ? requestedScale
  : 1;
const frame = document.getElementById('prototype');

frame.addEventListener('load', () => {
  const bench = frame.contentWindow;
  const originalToolsFor = bench.toolsFor;
  const originalBuildCtx = bench.buildCtx;
  if (typeof originalToolsFor !== 'function' || typeof originalBuildCtx !== 'function') {
    throw new Error('Canonical Bench did not expose its toolbar builders; experiment cannot preserve its control set.');
  }

  // ADR-115/A24 removed Font from the canonical source. Preserve historical A explicitly.
  bench.toolsFor = kind => {
    const tools = originalToolsFor(kind).filter(tool => kind !== 'text' || tool[0] !== 'Font');
    if (kind !== 'text' || variant === 'no-font') return tools;
    return bench.toolsForBeforeA24(kind);
  };

  const expected = variant === 'no-font'
    ? ['Edit', 'Size', 'Ink', 'Duplicate', 'Delete']
    : ['Edit', 'Font', 'Size', 'Ink', 'Duplicate', 'Delete'];
  const observed = bench.toolsFor('text').map(tool => tool[0]);
  if (JSON.stringify(observed) !== JSON.stringify(expected)) {
    throw new Error(`Unexpected selected-text actions: ${observed.join(', ')}`);
  }

  bench.buildCtx = kind => {
    originalBuildCtx(kind);
    if (variant !== 'current' || kind !== 'text') return;

    const font = [...bench.document.querySelectorAll('#ctx button')]
      .find(button => button.textContent.trim() === 'Font');
    if (!font) throw new Error('Current condition could not find the selected-text Font control.');
    font.disabled = true;
  };

  const experimentStyle = bench.document.createElement('style');
  experimentStyle.textContent = [
    '.ctx button:disabled{opacity:.35;cursor:default}',
    '.ctx button:disabled:hover{background:none}'
  ].join('');
  bench.document.head.appendChild(experimentStyle);

  bench.document.documentElement.style.fontSize = `${textScale * 100}%`;
  document.documentElement.dataset.experimentVariant = variant;
  document.documentElement.dataset.experimentReady = 'true';

  const selected = bench.document.querySelector('.el.selected');
  if (selected) bench.buildCtx(selected.dataset.kind);
});
</script>
