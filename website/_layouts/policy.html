<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#E9E29B">
  <meta name="description" content="Zinely privacy policy: what the offline Android app stores, what leaves your device, and when.">
  <link rel="canonical" href="https://aritr-codes.github.io/zinely-android/privacy/">
  <title>Privacy policy — Zinely</title>
  <link rel="icon" href="{{ '/assets/logo.webp' | relative_url }}" type="image/webp">
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Zinely home">
      <img src="{{ '/assets/logo.webp' | relative_url }}" width="48" height="48" alt="">
      <span>Zinely</span>
    </a>
    <nav aria-label="Primary navigation">
      <a href="{{ '/#see-zinely' | relative_url }}">See Zinely</a>
      <a href="{{ '/#how-it-works' | relative_url }}">How it works</a>
      <a href="{{ '/#fold-guide' | relative_url }}">Fold guide</a>
    </nav>

  <main id="main" class="policy-layout">
    <article class="policy">
      {{ content }}
    </article>
  </main>

  <footer>
    <p><strong>Zinely</strong> — physical media instead of social media.</p>
    <nav aria-label="Footer navigation">
      <a href="{{ '/#about' | relative_url }}">About</a>
      <a href="{{ '/#accessibility' | relative_url }}">Accessibility</a>
      <a href="{{ '/changelog/' | relative_url }}">Changelog</a>
      <a href="{{ '/roadmap/' | relative_url }}">Roadmap</a>
      <a href="{{ '/privacy/' | relative_url }}" aria-current="page">Privacy</a>
      <a href="mailto:aritr.g06@gmail.com">Contact</a>
      <a href="https://github.com/aritr-codes/zinely-android">GitHub</a>
    </nav>
  </footer>
