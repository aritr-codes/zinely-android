name: Deploy website

on:
  push:
    branches: [ main ]
    paths:
      - website/**
      - .github/workflows/pages.yml
      - app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
      - docs/PRIVACY-POLICY.md
      - tools/check-public-copy.cjs
  workflow_dispatch:
  pull_request:
    paths:
      - website/**
      - .github/workflows/pages.yml
      - docs/PRIVACY-POLICY.md
      - tools/check-public-copy.cjs

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check public copy and links
        run: |
          node tools/check-public-copy.cjs
          node --check website/assets/site.js

      - name: Prepare site
        run: |
          mkdir -p _pages_source/assets _pages_source/privacy
          cp -R website/. _pages_source/
          cp app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp _pages_source/assets/logo.webp
          printf '%s\n' '---' 'layout: policy' 'permalink: /privacy/' '---' > _pages_source/privacy/index.md
          cat docs/PRIVACY-POLICY.md >> _pages_source/privacy/index.md

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_pages_source
          destination: ./_site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Publish static site
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
